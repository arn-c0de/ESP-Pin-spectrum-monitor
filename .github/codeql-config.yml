name: "Custom CodeQL Configuration"

disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality

paths:
  - backend
  - frontend
  - firmware

paths-ignore:
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/.git/**"
  - "**/test/**"
  - "**/tests/**"

# Custom configuration for C/C++ analysis
cpp:
  source-roots:
    - firmware/arduino-uno/gpio_monitor
  include-paths:
    - firmware/arduino-uno/gpio_monitor
  define-macros:
    - ARDUINO=10813
    - F_CPU=16000000L
  standard: c++11